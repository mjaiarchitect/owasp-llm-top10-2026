<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Security Intuition — Concept</title>
  <style>
    :root { --ink:#07151c; --text:#e8f1f5; --muted:#a8bbc6; --teal:#2ec4b6; --line:rgba(232,241,245,0.14); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--ink); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; justify-content:flex-end; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid var(--line); }
    a.back { color:#04201d; background:var(--teal); text-decoration:none; font-weight:700; padding:0.65rem 1.1rem; border-radius:0.45rem; }
    a.back:hover { filter:brightness(1.08); }
    main { flex:1; padding:1.25rem 1.5rem 2rem; display:flex; flex-direction:column; gap:1rem; max-width:1600px; margin:0 auto; width:100%; }
    figure { margin:0; border:1px solid var(--line); border-radius:0.75rem; overflow:hidden; background:#041018; }
    figure img { width:100%; height:auto; display:block; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../owasp-llm-top10.html#simple">← Back</a>
  </header>
  <main>
    <figure>
      <img src="images/security-intuition-two-extremes.jpg" width="2560" height="1440" alt="Security intuition bell curve with street, home, and bunker scenes on the curve" />
    </figure>
  </main>
</body>
</html>
