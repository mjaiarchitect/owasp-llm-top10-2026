<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Before Words, We Learn “Safe”</title>
  <style>
    :root {
      --ink:#07151c;
      --ink-deep:#031017;
      --panel:#0b2029;
      --text:#e8f1f5;
      --muted:#b8c9d1;
      --teal:#2ec4b6;
      --warm:#ffb45e;
      --line:rgba(232,241,245,0.16);
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    html { color-scheme:dark; }

    body {
      min-height:100vh;
      font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 8% 3%, rgba(46,196,182,0.12), transparent 28rem),
        radial-gradient(circle at 94% 42%, rgba(255,180,94,0.08), transparent 32rem),
        var(--ink);
    }

    header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:2rem;
      width:min(100%, 1920px);
      margin:0 auto;
      padding:clamp(1.2rem,2.3vw,2.4rem) clamp(1.25rem,3vw,3.5rem);
      border-bottom:1px solid var(--line);
    }

    .brand {
      display:flex;
      align-items:center;
      gap:0.8rem;
      color:var(--muted);
      font-size:1rem;
      font-weight:750;
      letter-spacing:0.1em;
      text-transform:uppercase;
    }

    .brand::before {
      width:0.8rem;
      height:0.8rem;
      content:"";
      border-radius:50%;
      background:var(--teal);
      box-shadow:0 0 1.5rem rgba(46,196,182,0.8);
    }

    a.back {
      flex:none;
      color:#04201d;
      background:var(--teal);
      text-decoration:none;
      font-size:1.05rem;
      font-weight:800;
      padding:0.85rem 1.25rem;
      border-radius:999px;
      box-shadow:0 0.7rem 2rem rgba(0,0,0,0.2);
      transition:transform 160ms ease, filter 160ms ease;
    }

    a.back:hover { filter:brightness(1.08); transform:translateY(-2px); }
    a.back:focus-visible { outline:3px solid var(--warm); outline-offset:4px; }

    main {
      width:min(100%, 1920px);
      margin:0 auto;
      padding:clamp(2.4rem,5vw,5.5rem) clamp(1.25rem,3vw,3.5rem) clamp(4rem,7vw,7rem);
    }

    .hero {
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(18rem, 0.48fr);
      align-items:end;
      gap:clamp(1.5rem,4vw,5rem);
      margin-bottom:clamp(3.5rem,6vw,6.5rem);
    }

    .eyebrow {
      margin-bottom:0.8rem;
      color:var(--teal);
      font-size:clamp(1rem,1.3vw,1.2rem);
      font-weight:850;
      letter-spacing:0.13em;
      text-transform:uppercase;
    }

    h1 {
      max-width:15ch;
      font-size:clamp(2.75rem,6vw,6.9rem);
      line-height:0.94;
      letter-spacing:-0.06em;
      text-wrap:balance;
    }

    .lead {
      max-width:36rem;
      padding-left:1.4rem;
      border-left:4px solid var(--warm);
      color:var(--muted);
      font-size:clamp(1.15rem,1.55vw,1.5rem);
      line-height:1.55;
      text-wrap:pretty;
    }

    .lesson-row + .lesson-row { margin-top:clamp(4.5rem,7vw,8rem); }

    .row-heading {
      display:flex;
      align-items:center;
      gap:1rem;
      margin-bottom:clamp(1.4rem,2vw,2.2rem);
    }

    .row-number {
      display:grid;
      flex:none;
      width:3.25rem;
      height:3.25rem;
      place-items:center;
      border:1px solid rgba(46,196,182,0.45);
      border-radius:50%;
      color:var(--teal);
      background:rgba(46,196,182,0.09);
      font-size:1.1rem;
      font-weight:900;
    }

    .row-heading h2 {
      font-size:clamp(1.65rem,2.8vw,3rem);
      line-height:1.08;
      letter-spacing:-0.035em;
    }

    .row-heading p {
      margin-top:0.35rem;
      color:var(--muted);
      font-size:clamp(1.05rem,1.2vw,1.2rem);
      line-height:1.45;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:clamp(1.25rem,2vw,2rem);
    }

    figure.card {
      position:relative;
      overflow:hidden;
      margin:0;
      border:1px solid var(--line);
      border-radius:1.35rem;
      background:linear-gradient(145deg, rgba(15,43,53,0.98), rgba(5,21,28,0.98));
      box-shadow:0 1.5rem 4rem rgba(0,0,0,0.28);
      transition:transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    figure.card:hover {
      transform:translateY(-5px);
      border-color:rgba(46,196,182,0.52);
      box-shadow:0 2rem 5rem rgba(0,0,0,0.38);
    }

    figure.card img {
      display:block;
      width:100%;
      height:auto;
      aspect-ratio:4 / 3;
      object-fit:cover;
      background:var(--ink-deep);
    }

    figure.card figcaption {
      min-height:8.6rem;
      padding:clamp(1.25rem,1.7vw,1.75rem);
      border-top:1px solid var(--line);
    }

    figure.card figcaption strong {
      display:block;
      margin-bottom:0.55rem;
      color:var(--text);
      font-size:clamp(1.25rem,1.45vw,1.5rem);
      line-height:1.2;
      letter-spacing:-0.02em;
    }

    figure.card figcaption span {
      color:var(--muted);
      font-size:clamp(1rem,1.05vw,1.12rem);
      line-height:1.5;
    }

    @media (max-width:900px) {
      header { align-items:flex-start; }
      .brand { font-size:0.9rem; }
      .hero { grid-template-columns:1fr; }
      h1 { max-width:12ch; }
      .lead { max-width:46rem; }
      .grid { grid-template-columns:1fr; }
      figure.card figcaption { min-height:0; }
    }

    @media (max-width:520px) {
      header { padding:1rem; }
      a.back { padding:0.72rem 0.95rem; font-size:0.96rem; }
      main { padding-inline:1rem; }
      .row-heading { align-items:flex-start; }
      .row-number { width:2.8rem; height:2.8rem; }
      figure.card { border-radius:1rem; }
    }

    @media (prefers-reduced-motion:reduce) {
      a.back, figure.card { transition:none; }
    }
  </style>
</head>
<body>
  <header>
    <p class="brand">Security intuition</p>
    <a class="back" href="../owasp-llm-top10.html#simple">← Back</a>
  </header>
  <main>
    <section class="lesson-row" aria-labelledby="self-learned">
      <div class="row-heading">
        <span class="row-number" aria-hidden="true">01</span>
        <div>
          <h2 id="self-learned">Top row — the infant pauses first</h2>
          <p>Depth, taste, and a pause before entering can all trigger a protective check.</p>
        </div>
      </div>
      <div class="grid">
        <figure class="card">
          <img src="images/infant-security-self-1.jpg" width="2048" height="1536" alt="Crawling infant pauses over a safe glass visual-cliff experiment while a caregiver watches nearby" fetchpriority="high" />
          <figcaption>
            <strong>The floor disappears.</strong>
            <span>With crawling experience, many babies pause at a perceived drop—even over safe glass.</span>
          </figcaption>
        </figure>
        <figure class="card">
          <img src="images/infant-security-self-2.jpg" width="2048" height="1536" alt="Infant turns away from a spoonful of safe bitter green food and raises one hand" />
          <figcaption>
            <strong>Bitter gets an instant “no.”</strong>
            <span>Babies often reject bitterness, an early warning cue also found in some harmful substances.</span>
          </figcaption>
        </figure>
        <figure class="card">
          <img src="images/infant-security-self-3.jpg" width="2048" height="1536" alt="Toddler peeks carefully from behind a doorframe before entering a hallway" />
          <figcaption>
            <strong>Look before you enter.</strong>
            <span>A pause at the doorway is early threat scanning—check first, then move.</span>
          </figcaption>
        </figure>
      </div>
    </section>

    <section class="lesson-row" aria-labelledby="mother-taught">
      <div class="row-heading">
        <span class="row-number" aria-hidden="true">02</span>
        <div>
          <h2 id="mother-taught">Bottom row — mother turns instinct into a rule</h2>
          <p>Simple rehearsals make the safe response easier to remember.</p>
        </div>
      </div>
      <div class="grid">
        <figure class="card">
          <img src="images/infant-security-mom-1.jpg" width="2048" height="1536" alt="Mother uses a stop gesture while showing her toddler a securely locked medicine box" loading="lazy" />
          <figcaption>
            <strong>Medicine never means candy.</strong>
            <span>The locked box makes one rule visible: only a caregiver gives medicine.</span>
          </figcaption>
        </figure>
        <figure class="card">
          <img src="images/infant-security-mom-2.jpg" width="2048" height="1536" alt="Mother rehearses the closed-door rule with her toddler beside an engaged security chain" loading="lazy" />
          <figcaption>
            <strong>A knock never opens the door.</strong>
            <span>They rehearse: stay back, keep it locked, and call a grown-up.</span>
          </figcaption>
        </figure>
        <figure class="card">
          <img src="images/infant-security-mom-3.jpg" width="2048" height="1536" alt="Mother on a dock teaches her toddler in a life jacket to wait before water" loading="lazy" />
          <figcaption>
            <strong>Water starts with “wait.”</strong>
            <span>Life jacket on, hold my hand, and never step toward water alone.</span>
          </figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
